apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files in ${WORKSPACE_SOURCE_PATH} ..."
        # Delete everything, including hidden files, but not the directory itself
        find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -delete
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to the test command
      type: string
      default: ""
  steps:
    - name: jest-test
      image: node:20-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm ci
        npm test -- $(params.args)
