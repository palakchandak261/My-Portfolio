services:
  postgres:
    image: postgres:15
    container_name: twin_postgres
    restart: always
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: digitwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d digitwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: twin_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://twin:twin@postgres:5432/digitwin
    volumes:
      - ./ai-agent:/ai-agent
    command: python app.py

  worker:
    build: ./backend
    container_name: twin_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://twin:twin@postgres:5432/digitwin
    command: python worker.py

  prometheus:
    image: prom/prometheus:latest
    container_name: twin_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
